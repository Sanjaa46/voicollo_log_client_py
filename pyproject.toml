[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lms-logger"
dynamic = ["version"]
description = "Python client for the Voicollo Log Management System (signed ingestion, retries, buffering, logging handler)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Voicollo" }]
keywords = ["logging", "audit", "lms", "hmac", "voicollo"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Logging",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.25,<1",
  "pydantic>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/Sanjaa46/voicollo_log_client_py"
Changelog = "https://github.com/Sanjaa46/voicollo_log_client_py/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/lms_logger/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lms_logger"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
strict = true
packages = ["lms_logger"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
